# Every push: unit tests, then a small end-to-end run (generate -> validate -> evaluate -> verify).
# Real-terrain mode needs ~100 MB of downloads, so CI uses synthetic scenes only.
image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MPLBACKEND: Agg

cache:
  paths: [.cache/pip]

before_script:
  - apt-get update -qq && apt-get install -y -qq fonts-dejavu-core > /dev/null
  - pip install -q -r requirements.txt

tests:
  stage: test
  script:
    - python -m pytest -q

end_to_end:
  stage: test
  script:
    - python build_dataset.py --per-level 2 --levels 1 3 5 --out ci_dataset --workers 2
    - python evaluate.py --dataset ci_dataset --models mock:oracle mock:random mock:stubborn --blind --run ci
    - python staircase.py --dataset ci_dataset --models mock:oracle mock:random --trials 8 --run ci_eye
    - python verify_results.py --dataset ci_dataset --run results/ci --regen 2 --out ci_docs
    - 'grep -q "All reported accuracies reproduced exactly: yes" ci_docs/VERIFICATION.md'
    - 'grep -q "2/2 sampled scenes regenerated byte-for-byte" ci_docs/VERIFICATION.md'
  artifacts:
    when: always
    paths:
      - ci_dataset/manifest.json
      - results/ci/REPORT.md
      - results/ci_eye/EYE_EXAM.md
      - ci_docs/VERIFICATION.md
