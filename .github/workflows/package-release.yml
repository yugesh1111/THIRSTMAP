name: package-release
# Builds the pip package on GitHub's runners, installs it in a clean environment, runs the `thirstmap` command
# outside the repository, and publishes the wheel as a GitHub Release. Trigger: push a tag like v1.0.0,
# or run it manually with the tag to create.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        default: "v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel
        run: |
          pip wheel --no-deps -w dist .
          (cd dist && sha256sum *.whl > SHA256SUMS.txt)
          ls -la dist
      - name: install it in a clean environment and run it outside the repository
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          mkdir -p /tmp/try && cd /tmp/try
          /tmp/clean/bin/thirstmap generate --level 2 --seed 7 --twin --out scenes
          ls scenes/*/answer_key.json
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "ThirstMap $TAG (pip package)" \
            --notes-file .github/package-release-notes.md
