name: ci
# Every push: unit tests, then a small end-to-end run (generate -> validate -> evaluate -> verify)
# that must reproduce its own numbers and regenerate scenes byte-for-byte; and the pip-installed command.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  end_to_end:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: build a small dataset
        run: python build_dataset.py --per-level 2 --levels 1 3 5 --out ci_dataset --workers 2
      - name: evaluate offline baselines
        run: python evaluate.py --dataset ci_dataset --models mock:oracle mock:random mock:stubborn --blind --run ci
      - name: adaptive eye exam
        run: python staircase.py --dataset ci_dataset --models mock:oracle mock:random --trials 8 --run ci_eye
      - name: independent verification
        run: |
          python verify_results.py --dataset ci_dataset --run results/ci --regen 2 --out ci_docs
          grep -q "All reported accuracies reproduced exactly: yes" ci_docs/VERIFICATION.md
          grep -q "2/2 sampled scenes regenerated byte-for-byte" ci_docs/VERIFICATION.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence
          path: |
            ci_dataset/manifest.json
            results/ci/REPORT.md
            results/ci_eye/EYE_EXAM.md
            ci_docs/VERIFICATION.md

  package:
    # pip install, then the `thirstmap` command from outside the repository, without system fonts (as on Colab)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: the thirstmap command works anywhere
        run: |
          mkdir -p /tmp/pkg && cd /tmp/pkg
          thirstmap list
          thirstmap generate --level 1 --seed 3 --twin --out scenes
          ls scenes/*/answer_key.json scenes/*/map.png

  notebook:
    # the Colab quickstart, executed top to bottom (no API key: the optional Gemini cell skips itself)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install nbconvert ipykernel
      - name: execute ThirstMap_quickstart.ipynb
        run: |
          mkdir -p /tmp/nb && cp ThirstMap_quickstart.ipynb /tmp/nb/ && cd /tmp/nb
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 ThirstMap_quickstart.ipynb --output run.ipynb
          python -c "import json; nb=json.load(open('run.ipynb')); e=[o for c in nb['cells'] if c['cell_type']=='code' for o in c['outputs'] if o['output_type']=='error']; assert not e, e; print('notebook ran without errors')"
