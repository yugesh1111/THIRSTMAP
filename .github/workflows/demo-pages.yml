name: demo-pages
# Publishes docs/demo (built by build_demo.py) to the gh-pages branch, served by GitHub Pages:
# https://yugesh1111.github.io/THIRSTMAP/
on:
  push:
    branches: [main]
    paths: ["docs/demo/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Push docs/demo to gh-pages"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir site && cp -r docs/demo/. site/ && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "Amritha S"
          git config user.email "44322871-Amritha902@users.noreply.gitlab.com"
          git add -A
          git commit -q -m "Demo site from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
